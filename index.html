<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Autenticación</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <h1>Bienvenido al Blog</h1>
        
        <div id="login-section">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Usuario" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit">Ingresar</button>
            </form>
            <p>¿No tienes cuenta? <a href="#" id="show-register">Regístrate aquí</a></p>
        </div>

        <div id="register-section" style="display: none;">
            <h2>Registro</h2>
            <form id="register-form">
                <input type="text" id="reg-username" placeholder="Nuevo Usuario" required>
                <input type="password" id="reg-password" placeholder="Contraseña" required>
                <button type="submit">Registrar</button>
            </form>
            <p>¿Ya tienes cuenta? <a href="#" id="show-login">Inicia sesión</a></p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
